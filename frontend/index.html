<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airline Reservation System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h1>Airline Reservation System</h1>
    <nav>
    <a href="index.html">Home</a> |
    <a href="bookings.html">My Bookings</a> |
    <a href="login.html">Login</a> |
    <button onclick="logout()">Logout</button>
</nav>
   <p id="welcomeMessage">Search and book your flight easily.</p>

    <h2>Search Flights</h2>

    <form id="searchForm">

        <label>From:</label>
        <input type="text" id="from" placeholder="Enter departure city" required>

        <br><br>

        <label>To:</label>
        <input type="text" id="to" placeholder="Enter destination city" required>

        <br><br>

        <label>Date:</label>
        <input type="date" id="date" required>

        <br><br>

        <button type="submit">Search Flights</button>

    </form>
    <br><br>

<a href="bookings.html">View My Bookings</a>
<script>
    function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");

        alert("Logged out successfully.");

        window.location.href = "login.html";
    }
</script>
<script>
    const user = JSON.parse(localStorage.getItem("user"));

    if (user) {
        document.getElementById("welcomeMessage").textContent =
            `Welcome, ${user.name}! Search and book your flight easily.`;
    }
</script>
<script src="js/script.js"></script>
<footer>
    <p>© 2026 Airline Reservation System</p>
</footer>
</body>
</html>
